<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Control - Bitácora Automotriz</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }
        h2, h3 {
            color: #333;
        }
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #eee;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        button.logout-btn {
            background-color: #dc3545;
            padding: 8px 15px;
            font-size: 14px;
            margin-top: 0;
        }
        button.logout-btn:hover {
            background-color: #c82333;
        }
        .form-group {
            margin-bottom: 12px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #555;
        }
        input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            padding: 10px 15px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 15px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background-color: #0056b3;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            padding: 10px;
            border: 1px solid #ddd;
            text-align: left;
        }
        th {
            background-color: #007bff;
            color: white;
        }
        .delete-btn {
            background-color: #dc3545;
            padding: 5px 10px;
            font-size: 13px;
            margin-top: 0;
        }
        .delete-btn:hover {
            background-color: #c82333;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-bar">
            <h2>Bitácora Automotriz - Panel Principal</h2>
            <button class="logout-btn" id="logoutBtn">Cerrar Sesión</button>
        </div>

        <h3>Registrar Nuevo Vehículo</h3>
        <form id="vehiculoForm">
            <div class="form-group">
                <label for="marca">Marca:</label>
                <input type="text" id="marca" required>
            </div>
            <div class="form-group">
                <label for="modelo">Modelo:</label>
                <input type="text" id="modelo" required>
            </div>
            <div class="form-group">
                <label for="anio">Año:</label>
                <input type="number" id="anio" required>
            </div>
            <div class="form-group">
                <label for="kilometraje">Kilometraje:</label>
                <input type="number" id="kilometraje" required>
            </div>
            <button type="submit">Guardar Vehículo</button>
        </form>

        <h3 style="margin-top: 40px;">Lista de Vehículos Registrados</h3>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Marca</th>
                    <th>Modelo</th>
                    <th>Año</th>
                    <th>Kilometraje</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="vehiculosTableBody">
                <!-- Los vehículos se cargan dinámicamente aquí con JavaScript -->
            </tbody>
        </table>
    </div>

    <script>
        // Verificar si el usuario tiene un token guardado (si no, lo regresa al login)
        const token = localStorage.getItem('token');
        if (!token) {
            window.location.href = 'login.html';
        }

        // Cerrar sesión
        document.getElementById('logoutBtn').addEventListener('click', () => {
            localStorage.removeItem('token');
            window.location.href = 'login.html';
        });

        // Cargar la lista de vehículos al abrir la página
        async function cargarVehiculos() {
            try {
                const respuesta = await fetch('http://localhost:3000/api/vehiculos');
                const vehiculos = await respuesta.json();
                
                const tbody = document.getElementById('vehiculosTableBody');
                tbody.innerHTML = '';

                vehiculos.forEach(v => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${v.id}</td>
                        <td>${v.marca}</td>
                        <td>${v.modelo}</td>
                        <td>${v.anio}</td>
                        <td>${v.kilometraje}</td>
                        <td><button class="delete-btn" onclick="eliminarVehiculo(${v.id})">Eliminar</button></td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (error) {
                console.error('Error al cargar los vehículos:', error);
            }
        }

        // Registrar un nuevo vehículo enviando el Token JWT protegido
        document.getElementById('vehiculoForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const marca = document.getElementById('marca').value;
            const modelo = document.getElementById('modelo').value;
            const anio = document.getElementById('anio').value;
            const kilometraje = document.getElementById('kilometraje').value;

            try {
                const respuesta = await fetch('http://localhost:3000/api/vehiculos', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ marca, modelo, anio, kilometraje })
                });

                if (respuesta.ok) {
                    document.getElementById('vehiculoForm').reset();
                    cargarVehiculos(); // Recargar la tabla
                } else {
                    alert('No se pudo registrar el vehículo. Verifique su sesión.');
                }
            } catch (error) {
                alert('Error de conexión con el servidor');
            }
        });

        // Eliminar un vehículo utilizando el Token JWT protegido
        async function eliminarVehiculo(id) {
            if (!confirm('¿Estás seguro de eliminar este vehículo?')) return;

            try {
                const respuesta = await fetch(`http://localhost:3000/api/vehiculos/${id}`, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (respuesta.ok) {
                    cargarVehiculos(); // Recargar la tabla
                } else {
                    alert('No autorizado o error al eliminar');
                }
            } catch (error) {
                alert('Error de conexión con el servidor');
            }
        }

        // Ejecutar la función al cargar la página
        cargarVehiculos();
    </script>

</body>
</html>
